<!-- Calibration Dialog -->
<dialog id="calibration-dialog">
  <div class="dialog-content">
    <h2 style="margin-top: 0; color: #2c3e50;">Screen Calibration</h2>
    
    <div id="dialog-reference" style="margin: 0 auto; position: relative; background: transparent; min-height: 200px; display: flex; align-items: center; justify-content: center;">
      <div id="dialog-reference-text" style="text-align: center; width: 100%; margin-top: 30px;">
        <p>In order to determine the resolution of your screen.</p> 
        <p>We will use a standard sized object that most people have on hand.</p>
        <p>Please hold a bank card against the screen.</p>
        <p>And adjust the lines to match the height.</p>
      </div>
    </div>
    
    <div style="margin: 20px 0;">
      <div style="display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 10px;">
        <button id="calibrate-down" style="width: 50px; height: 50px; font-size: 24px; border-radius: 50%;">−</button>
        
        <div style="min-width: 80px; text-align: center;">
          <div style="font-size: 1.4em; font-weight: bold;" id="calibration-percent">100%</div>
        </div>
        
        <button id="calibrate-up" style="width: 50px; height: 50px; font-size: 24px; border-radius: 50%;">+</button>
      </div>
    </div>
    
    <div class="dialog-buttons">
      <button id="reset-calibration" class="secondary">Reset</button>
      <button id="close-calibration">Looks Good</button>
    </div>
  </div>
</dialog>
