<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Demo</title>
    <style>
        html, body { height: 100%; }
        body {
          margin: 0;
          padding: 20px;
          font-family: Arial, sans-serif;
          display: flex;
          flex-direction: column;
          box-sizing: border-box;
        }
        .controls {
          margin: 20px 0;
          padding: 15px;
          background: #f5f5f5;
          border-radius: 4px;
          flex: 0 0 auto;
        }
        #canvas-container {
          border: 1px solid #ccc;
          margin: 0; /* remove extra margin to maximize space */
          background: #f8f9fa;
          flex: 1 1 auto;
          min-height: 0; /* important so flex item can shrink below content height */
          min-width: 0;
        }
        button { padding: 8px 16px; margin-right: 10px; cursor: pointer; }
        #coordinates { margin-left: 20px; font-family: monospace; }
    </style>

    <!-- Load Fabric.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/fabric@6/dist/index.min.js"></script>
    <!-- Load UMD build of schematic to avoid CORS issues in browser -->
    <script src="../dist/schematic.umd.js"></script>
    <!-- Load the calibration dialog styles -->
    <link rel="stylesheet" href="../src/components/calibration/styles.css">
  </head>
<body>
  <!-- Calibration Dialog Container -->
  <div id="calibration-dialog-container"></div>
  
  <div class="controls">
    <div style="margin-bottom:15px;">
      Schematic: A FabricJS library, facilitating working above coordinate planes
      </div>
      <div style="margin-bottom:15px;">
        <label style="margin-right:15px;">
          <input type="checkbox" id="toggleGrid" checked>
          Show Grid
        </label>
        <label style="margin-right:15px;">
          <input type="checkbox" id="toggleZoomOnCenter" checked>
          Zoom on Origin
        </label>
        <label style="margin-right:15px;">
          <input type="checkbox" id="toggleMouseWheelZoom" checked disabled>
          Mouse Wheel Zoom
        </label>
        <label>
          <input type="checkbox" id="toggleScrollbars" disabled>
          Show Scrollbars
        </label>
      </div>
      <div style="margin-bottom:15px;">
        <label style="margin-right:10px;">
          Pin Origin: 
          <select id="pinSelect" style="width:100px;">
            <option selected value="NONE">None</option>
            <option value="TOP_LEFT">Top Left</option>
            <option value="TOP_RIGHT">Top Right</option>
            <option value="BOTTOM_LEFT">Bottom Left</option>
            <option value="BOTTOM_RIGHT">Bottom Right</option>
          </select>
        </label>
        <label style="margin-right:10px;">
          Pin Margin: <input id="pinMarginInput" type="number" step="1" value="10" style="width:70px;">
        </label>
        <!-- <button id="refreshUI">Refresh UI</button> -->
      </div>
      <div style="margin-bottom:15px;">
        <span id="coordinates">X: 0, Y: 0</span>
        <span id="zoomLevel" style="margin-left: 20px; font-family: monospace;">Zoom: 1.00x</span>
        <span id="pixelRatio" style="margin-left: 20px; font-family: monospace;">Device Pixel Ratio: 1.0</span>
        <div id="docs" style="margin-left: 20px; font-family: monospace; font-style: italic;">
          <br> Use mouse wheel to zoom in/out.
          <br> Hold ALT key to zoom on cursor.
          <br> Right-click + drag to pan.
        </div>
      </div>
      <div style="margin-bottom:15px;">
        <label style="margin-right:10px;">
          Units: 
          <select id="unitsSelect" style="width:100px;" >
            <option selected value="points">Points</option>
            <option value="imperial">Imperial</option>
            <option value="metric">Metric</option>
          </select>
        </label>
        <button id="btn-calibrate" style="margin-left: 15px;">Calibration</button>
      </div>
    </div>
    <div id="canvas-container"></div>
    
    <!-- Module imports for calibration -->
    <script type="module">
      // Import calibration dialog
      import CalibrationDialog from '../src/components/calibration/index.js';
      
      // Import Schematic from UMD build
      const { Grid, Schematic } = window.Schematic;

      document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('canvas-container');
        
        // Initialize schematic with grid enabled (size from container)
        const schematic = new Schematic(container, {
          gridEnabled: true, // Grid will be enabled by default
          zoomDebounceDelay: 200, // Configure the zoom debounce delay
          units: 'points' // Set default units to points
        });
        
        // Get the fabric instance from the schematic
        const fabricCanvas = schematic.fabricCanvas;

        // Get the map instance from the schematic
        const mapInstance = schematic.mapInstance;
        
        // Listen for pan events from Schematic
        schematic.on('pan:move', (data) => {
          // Could update UI here if needed
        });
        
        schematic.on('pan:completed', () => {
          // Could perform actions when panning completes
          console.log('Panning completed');
        });
        
        // Listen for zoom events from Schematic
        schematic.on('zoom:change', (data) => {
          updateUIDisplay();
        });
        
        schematic.on('zoom:completed', (data) => {
          console.log('Zoom completed - final grid alignment done');
        });

        document.getElementById('resetView')?.addEventListener('click', () => {
          schematic.resetView();
        });

        document.getElementById('refreshUI')?.addEventListener('click', () => {
          updateUIDisplay();
        });

        const pinSelect = document.getElementById('pinSelect');
        const pinMarginInput = document.getElementById('pinMarginInput');
        const applyPin = () => {
          const pin = pinSelect?.value || 'NONE';
          const margin = Math.max(0, Number(pinMarginInput?.value) || 0);
          schematic.setOriginPin(pin, margin);
        };
        pinSelect?.addEventListener('change', applyPin);
        pinMarginInput?.addEventListener('change', applyPin);
        
        // Set initial parameters using Schematic methods
        schematic.setZoom(1.0);

        // Resize canvas when container changes size
        const resize = () => {
          const w = container.clientWidth;
          const h = container.clientHeight;
          if (schematic?.mapInstance && typeof schematic.mapInstance.onResize === 'function') {
            schematic.mapInstance.onResize(w, h);
          }
        };
        // Observe container resize
        if ('ResizeObserver' in window) {
          const ro = new ResizeObserver(() => resize());
          ro.observe(container);
        } else {
          // Fallback
          window.addEventListener('resize', resize);
        }
        // Initial sizing
        resize();

        // Persist-only: wire Show Scrollbars to schematic (no behavior)
        const toggleScrollbars = document.getElementById('toggleScrollbars');
        const syncScrollbarsPref = () => {
          const checked = !!toggleScrollbars?.checked;
          if (typeof schematic.setShowScrollbars === 'function') {
            schematic.setShowScrollbars(checked);
          }
        };
        toggleScrollbars?.addEventListener('change', syncScrollbarsPref);
        // Initialize preference on load
        syncScrollbarsPref();

        // Persist-only: wire Zoom On Origin to schematic (no behavior)
        const toggleZoomOnCenter = document.getElementById('toggleZoomOnCenter');
        const syncZoomOnCenterPref = () => {
          const checked = !!toggleZoomOnCenter?.checked;
          if (typeof schematic.setZoomOnCenter === 'function') {
            schematic.setZoomOnCenter(checked);
          }
        };
        toggleZoomOnCenter?.addEventListener('change', syncZoomOnCenterPref);
        // Initialize preference on load
        syncZoomOnCenterPref();

        // Wire Mouse Wheel Zoom to schematic
        const toggleMouseWheelZoom = document.getElementById('toggleMouseWheelZoom');
        const syncMouseWheelZoomPref = () => {
          const checked = !!toggleMouseWheelZoom?.checked;
          if (typeof schematic.setMouseWheelZoom === 'function') {
            schematic.setMouseWheelZoom(checked);
          }
        };
        toggleMouseWheelZoom?.addEventListener('change', syncMouseWheelZoomPref);
        // Initialize preference on load
        syncMouseWheelZoomPref();

        // Persist-only: wire Show Grid to schematic (no behavior)
        const toggleGrid = document.getElementById('toggleGrid');
        const syncShowGridPref = () => {
          const checked = !!toggleGrid?.checked;
          if (typeof schematic.setShowGrid === 'function') {
            schematic.setShowGrid(checked);
          }
        };
        toggleGrid?.addEventListener('change', syncShowGridPref);
        // Initialize preference on load
        syncShowGridPref();

        // Add sample content to demonstrate the library using Schematic's API
        const circle = new fabric.Circle({
          left: 100, // is center (see originX)
          top: 100, // is center (see originy)
          radius: 50,
          fill: '#f8f8f8',
          stroke: '#999',
          strokeWidth: 1,
          selectable: true,
          originX: 'center',
          originY: 'center'
        });
        
        // Add the object through Schematic
        fabricCanvas.add(circle);
        
        // Add another object to verify objects are being added correctly
        const rect = new fabric.Rect({
          left: 100, // is center (see originX)
          top: 100, // is center (see originy)
          width: 80,
          height: 60,
          fill: '#ddf',
          stroke: '#99c',
          strokeWidth: 2,
          selectable: true,
          originX: 'center',
          originY: 'center'
        });
        
        fabricCanvas.add(rect);
        
        // Custom display update function that works with Schematic
        function updateUIDisplay() {
          // Update zoom level display
          if (document.getElementById('zoomLevel')) {
            const zoomLevel = `Zoom: ${mapInstance.zoom ? mapInstance.zoom.toFixed(2) : '1.00'}x`;
            document.getElementById('zoomLevel').textContent = zoomLevel;
          }
          
          // Update device pixel ratio display
          if (document.getElementById('pixelRatio')) {
            // Use calibrated pixel ratio if available, otherwise use reported ratio
            const reportedRatio = window.devicePixelRatio || 1;
            const calibratedRatio = window.calibratedDPR || reportedRatio;
            document.getElementById('pixelRatio').textContent = 
              `Device Pixel Ratio: ${calibratedRatio.toFixed(3)} (Reported: ${reportedRatio.toFixed(3)})`;
          }
          
          // Coordinates are updated live from mouse:move
        }

        // Live update: mouse position in grid/world coordinates
        fabricCanvas.on('mouse:move', (opt) => {
          const el = (fabricCanvas.getElement && fabricCanvas.getElement()) || fabricCanvas.upperCanvasEl || fabricCanvas.lowerCanvasEl;
          if (!el) return;
          const rect = el.getBoundingClientRect();
          const px = opt.e.clientX - rect.left;
          const py = opt.e.clientY - rect.top;
          const vpt = fabricCanvas.viewportTransform;
          if (!vpt) return;
          const worldX = (px - vpt[4]) / vpt[0];
          const worldY = (py - vpt[5]) / vpt[3];
          const gridY = -worldY; // grid uses inverted Y
          const coordsEl = document.getElementById('coordinates');
          if (coordsEl) {
            coordsEl.textContent = `X: ${worldX.toFixed(2)}, Y: ${gridY.toFixed(2)}`;
          }
        });
        
        // Also listen for grid control changes
        schematic.on('grid:change', () => {
          console.log('Grid settings changed');
          updateUIDisplay();
        });
        
        // Units selector handling
        const unitsSelect = document.getElementById('unitsSelect');
        const syncUnits = () => {
          const selectedUnits = unitsSelect?.value || 'points';
          if (typeof schematic.setUnits === 'function') {
            schematic.setUnits(selectedUnits);
          }
        };
        unitsSelect?.addEventListener('change', syncUnits);
        // Initialize units on load
        syncUnits();
        
        // Initialize calibration dialog
        const calibrationDialogContainer = document.getElementById('calibration-dialog-container');
        const calibrateBtn = document.getElementById('btn-calibrate');
        
        // Create calibration dialog instance with appropriate unit system
        const calibrationDialog = new CalibrationDialog({
          container: calibrationDialogContainer,
          gridState: window.gridState || {}, // Create if it doesn't exist
          system: unitsSelect?.value || 'points', // Use current units selection
          targetHeight: 318, // Target height in pixels
          dpi: 96, // Standard DPI
          onCalibrationComplete: (result) => {
            // Store the calculated device pixel ratio globally
            window.calibratedDPR = result.calculatedDPR;
            
            // Update the display to show the new calibrated ratio
            updateUIDisplay();
            
            // Log the calibration results
            console.log('Calibration completed:', result);
          }
        });
        
        // Set trigger button
        calibrationDialog.setTriggerButton(calibrateBtn);
        
        // Update calibration when units change
        unitsSelect?.addEventListener('change', () => {
          // Recreate calibration with new units
          const newCalibration = new CalibrationDialog({
            container: calibrationDialogContainer,
            gridState: window.gridState || {},
            system: unitsSelect.value,
            targetHeight: 318,
            dpi: 96,
            onCalibrationComplete: (result) => {
              // Store the calculated device pixel ratio globally
              window.calibratedDPR = result.calculatedDPR;
              
              // Update the display to show the new calibrated ratio
              updateUIDisplay();
              
              // Log the calibration results
              console.log('Calibration completed:', result);
            }
          });
          newCalibration.setTriggerButton(calibrateBtn);
        });
        
        // Store gridState for calibration
        window.gridState = {
          zoom: 1,
          referenceScale: 0
        };
        
        // Initialize calibrated DPR with the reported one
        window.calibratedDPR = window.devicePixelRatio || 1;
        
        // Listen for units change events from Schematic
        schematic.on('units:change', (data) => {
          console.log('Units changed:', data.units);
          // Update the dropdown if it doesn't match current units
          if (unitsSelect && unitsSelect.value !== data.units) {
            unitsSelect.value = data.units;
          }
          updateUIDisplay();
        });
        
        // Initialize pin settings and update UI once
        applyPin();
        updateUIDisplay();
      });
    </script>
</body>
</html>
