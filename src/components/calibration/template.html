<!-- Calibration Dialog -->
<dialog id="calibration-dialog">
  <div class="dialog-content">
    <h2 class="calibration-title">Screen Calibration</h2>
    
    <div id="dialog-reference">
      <div id="dialog-reference-text">
        <p>In order to determine the resolution of your screen.</p> 
        <p>We will use a standard sized object that most people have on hand.</p>
        <p>Please hold a bank card against the screen.</p>
        <p>And adjust the lines to match the height.</p>
      </div>
    </div>
    
    <div class="calibration-controls-container">
      <div class="calibration-controls">
        <button id="calibrate-down" class="calibration-btn">−</button>
        
        <div class="calibration-value-container">
          <div id="calibration-percent" class="calibration-value">100%</div>
        </div>
        
        <button id="calibrate-up" class="calibration-btn">+</button>
      </div>
      
      <div class="keyboard-hint">
        <small>Keyboard: <kbd>Alt</kbd> + <kbd>↑</kbd><kbd>↓</kbd> (1%), <kbd>←</kbd><kbd>→</kbd> (0.1%)</small>
      </div>
    </div>
    
    <div class="dialog-buttons">
      <button id="reset-calibration" class="secondary">Reset</button>
      <button id="close-calibration">Looks Good</button>
    </div>
  </div>
</dialog>
